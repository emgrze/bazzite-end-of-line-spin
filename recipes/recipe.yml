# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
# Bazzite End of Line Spin
# Technical image name: bazzite-eol
name: bazzite-eol

description: "Bazzite End of Line Spin — Niri + Noctalia with Tron: Legacy inspired cyan neon aesthetic. Gaming stack preserved."

# Base: Bazzite KDE (desktop, AMD/Intel). Change to bazzite-nvidia / bazzite-nvidia-open if needed.
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  # 1. Copy configuration files into the image
  - type: files
    files:
      - source: system
        destination: /

  # 2. Repositories + package install / remove
  - type: dnf
    repos:
      files:
        # Brave official repository (for brave-origin)
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        # Terra (swww and other useful packages)
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        # Compositor + shell
        - niri
        - noctalia
        # Browser
        - brave-origin
        # Light supporting tools
        - alacritty
        - swww                     # from Terra
        - mako
        - wlsunset
        - thunar
        - xarchiver
        - jetbrains-mono-fonts
        - qt6ct
        # Portals
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
    remove:
      packages:
        - firefox
        - firefox-langpacks
        # Heavy / unnecessary KDE apps
        - dolphin
        - konsole
        - kate
        - kwrite
        - gwenview
        - okular
        - ark
        - kcalc
        - kcharselect
        - kfind
        - kmag
        - kmousetool
        - korganizer
        - kaddressbook
        - akregator
        - kmail
        - dragon
        - elisa
        - juk
        - k3b
        - kamoso
        - kolourpaint
        - kruler
        - kcolorchooser
        - spectacle
        - plasma-welcome
        - kde-gtk-config

  # 3. Signing (BlueBuild default)
  - type: signing
