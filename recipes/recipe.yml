# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
# Bazzite End of Line Spin
# Technical image name: bazzite-eol
name: bazzite-eol

description: "Bazzite End of Line Spin — Niri + Noctalia with Tron: Legacy inspired cyan neon aesthetic. Gaming stack preserved."

# Base: Bazzite KDE (desktop, AMD/Intel). For NVIDIA use: ghcr.io/ublue-os/bazzite-nvidia-open
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  # 1. Inject system configs (niri, portals, environment, skel)
  - type: files
    files:
      - source: system
        destination: /

  # 1b. Enable Terra repos shipped (disabled) by Bazzite
  - type: script
    snippets:
      - |
        set -euo pipefail
        for f in /etc/yum.repos.d/terra*.repo; do
          [ -f "$f" ] || continue
          sed -i 's/^enabled=0/enabled=1/' "$f" || true
        done
        echo "Terra repos enabled (if present):"
        grep -H '^enabled=' /etc/yum.repos.d/terra*.repo 2>/dev/null || true

  # 2. Packages — REMOVE first, then INSTALL (dependency-safe order)
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    remove:
      packages:
        # Default browser (replaced by Brave Origin)
        - firefox
        - firefox-langpacks
        # Heavy KDE apps — do NOT remove plasma-desktop / sddm stack
        - dolphin
        - konsole
        - kate
        - kwrite
        - gwenview
        - okular
        - ark
        - kcalc
        - kcharselect
        - kfind
        - kmag
        - kmousetool
        - korganizer
        - kaddressbook
        - akregator
        - kmail
        - dragon
        - elisa
        - juk
        - k3b
        - kamoso
        - kolourpaint
        - kruler
        - kcolorchooser
        - spectacle
        - plasma-welcome
    install:
      skip-unavailable: true
      packages:
        # Compositor + shell (Noctalia v5 binary = "noctalia")
        - niri
        - noctalia
        # Browser
        - brave-origin
        # Core desktop tools
        - alacritty
        - thunar
        - xarchiver
        - mako
        - wlsunset
        - qt6ct
        - playerctl
        - xwayland-satellite
        - jetbrains-mono-fonts
        # Wallpaper (Terra; skipped if unavailable)
        - swww
        # Portals
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk

  # 3. Image signing
  - type: signing
